<!DOCTYPE html>
<html>
<head>
  <title>Audio Trimmer</title>
  <style>
    body.dark {
      background-color: #030e14;
      color: #ffffff;
    }

    body.light {
      background-color: #f4f4f4;
      color: #111111;
    }

    pre {
      background-color: #1e1e1e;
      color: #ffffff;
      padding: 1rem;
      border-radius: 8px;
      font-family: monospace;
      font-size: 0.95rem;
      white-space: pre-wrap;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }

    button {
      background-color: #007acc;
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s ease;
    }

#selectFilesBtn {
  margin-left: 0.5rem;
  background-color: #4caf50;
}

#selectFilesBtn:hover {
  background-color: #3c9440;
}


    button:hover {
      background-color: #005fa3;
    }

    #fileList {
  margin-top: 1rem;
  padding-left: 1.2rem;
  font-family: monospace;
  color: #90ee90;
}

#fileList li::before {
  content: '✅ ';
  margin-right: 0.4em;
}

  </style>
</head>
<body>
  <h1>🎧 VoidChop</h1>
  <button id="trimBtn">Start Trimming</button>
  <button id="selectFilesBtn">➕ Add Audio Files</button>
  <button id="setDestinationBtn">📂 Set Destination Folder</button>
<h2>📝 Converted Files</h2>
<ul id="fileList"></ul>

  <script src="renderer.js"></script>
</body>
</html>
